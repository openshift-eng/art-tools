apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'art-alerting-jaeger'
spec:
  project: default
  source:
    repoURL: 'https://github.com/openshift-eng/art-config'
    path: clusters/artc2023/config/argocd/apps/art-alerting-jaeger
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: art-alerting
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true