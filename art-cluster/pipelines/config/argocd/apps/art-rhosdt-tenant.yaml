apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'art-rhosdt-tenant'
spec:
  project: default
  source:
    repoURL: 'https://github.com/openshift-eng/art-tools'
    path: art-cluster/pipelines/config/argocd/project/art-rhosdt-tenant
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: art-rhosdt-tenant
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
