apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'art-dashboard-server'
spec:
  project: default
  source:
    repoURL: 'https://github.com/openshift-eng/art-config'
    path: clusters/artc2023/config/argocd/apps/art-dashboard-server
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: art-dashboard-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
