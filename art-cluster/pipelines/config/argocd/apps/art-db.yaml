apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'art-db'
spec:
  project: default
  source:
    repoURL: 'https://github.com/openshift-eng/art-config'
    path: clusters/artc2023/config/argocd/apps/art-db
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: art-db
