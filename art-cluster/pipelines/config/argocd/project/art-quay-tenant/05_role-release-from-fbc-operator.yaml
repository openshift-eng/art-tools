apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-from-fbc-operator
  namespace: art-quay-tenant
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines"]
    resourceNames: ["release-from-fbc", "trigger-prod-release", "quay-scan", "quay-build", "quay-olm-bundle", "quay-build-fbc", "quay-schedule-scan"]
    verbs: ["get", "list"]
  - apiGroups: ["tekton.dev"]
    resources: ["tasks"]
    resourceNames: ["artcd"]
    verbs: ["get"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    resourceNames: ["release-from-fbc", "trigger-prod-release"]
    verbs: ["create", "get", "list", "watch", "patch"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
