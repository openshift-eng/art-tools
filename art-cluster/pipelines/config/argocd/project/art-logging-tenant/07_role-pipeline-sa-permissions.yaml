apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-sa-permissions
  namespace: art-logging-tenant
rules:
- apiGroups:
  - security.openshift.io
  resourceNames:
  - pipeline-fips-scc
  resources:
  - securitycontextconstraints
  verbs:
  - use
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tekton.dev
  resources:
  - pipelineruns
  verbs:
  - get
  - list
  - create
  - update
  - patch
  - delete
- apiGroups:
  - tekton.dev
  resources:
  - taskruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tekton.dev
  resources:
  - pipelines
  - tasks
  verbs:
  - get
  - list
