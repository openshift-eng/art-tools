kind: CronJob
apiVersion: batch/v1
metadata:
  name: kueue-schedule-scan-cron
  namespace: art-kueue-tenant
spec:
  schedule: "0 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: schedule-scan
              image: 'quay.io/redhat-user-workloads/ocp-art-tenant/art-cd:latest'
              command:
                - tkn
                - pipeline
                - start
                - schedule-layered-products-scan
                - '--use-param-defaults'
                - '--pipeline-timeout'
                - 6h
              imagePullPolicy: Always
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
          restartPolicy: OnFailure
          serviceAccountName: pipeline
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
