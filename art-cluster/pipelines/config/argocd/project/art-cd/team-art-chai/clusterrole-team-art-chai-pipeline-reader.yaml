apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: team-art-chai-pipeline-reader
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelines", "tasks", "pipelineruns", "taskruns", "customruns", "clustertasks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["results.tekton.dev"]
    resources: ["results", "records", "logs", "summary"]
    verbs: ["get", "list"]
