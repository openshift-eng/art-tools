apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-token
spec:
  data:
  - remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      key: art/prod/konflux/gitlab-token
      metadataPolicy: None
    secretKey: token
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: main-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: gitlab-token
