apiVersion: tekton.dev/v1
kind: Task
metadata:
  labels:
    app: artcd
  name: artcd
  namespace: art-openshift-tenant
spec:
  params:
  - default: artcd $@
    description: The artcd script to run
    name: script
    type: string
  - default: []
    description: artcd arguments to be passed
    name: args
    type: array
  stepTemplate:
    computeResources:
      requests:
        memory: "15Gi"
        cpu: "2"
      limits:
        memory: "16Gi"
        cpu: "4"
    env:
    - name: TASKRUN_NAMESPACE
      value: $(context.taskRun.namespace)
    - name: TASKRUN_NAME
      value: $(context.taskRun.name)
    - name: TASKRUN_UID
      value: $(context.taskRun.uid)
    - name: BUILD_URL
      value: https://console-openshift-console.apps.artc2023.pc3z.p1.openshiftapps.com/k8s/ns/art-openshift-tenant/tekton.dev~v1~TaskRun/$(context.taskRun.name)
    - name: GIT_SSH_COMMAND
      value: ssh -o StrictHostKeyChecking=no
    - name: GOOGLE_APPLICATION_CREDENTIALS
      value: /tmp/gcp-sa/sa.json
    - name: GIT_AUTHOR_NAME
      value: openshift-art-build-bot
    - name: GIT_AUTHOR_EMAIL
      value: openshift-dev-infra+github-openshift-art-build-bot@redhat.com
    - name: GIT_COMMITTER_NAME
      value: openshift-art-build-bot
    - name: GIT_COMMITTER_EMAIL
      value: openshift-dev-infra+github-openshift-art-build-bot@redhat.com
  steps:
  - args:
    - $(params.args[*])
    computeResources:
      requests:
        memory: "15Gi"
        cpu: "2"
      limits:
        memory: "16Gi"
        cpu: "4"
    env:
    - name: SLACK_BOT_TOKEN
      valueFrom:
        secretKeyRef:
          key: slack-api-token
          name: art-bot-config
    - name: JIRA_TOKEN
      valueFrom:
        secretKeyRef:
          key: token
          name: openshift-art-jira-bot-token
    - name: REDIS_SERVER_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: redis-server-password
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          key: token
          name: github-token
    - name: GITLAB_TOKEN
      valueFrom:
        secretKeyRef:
          key: token
          name: gitlab-token
          optional: true
    - name: KONFLUX_SA_KUBECONFIG
      value: /tmp/konflux-kubeconfigs/ocp
    - name: QUAY_AUTH_FILE
      value: /tmp/quay-authfile/config.json
    - name: DOCKER_CONFIG
      value: /tmp/quay-authfile
    image: quay.io/redhat-user-workloads/ocp-art-tenant/art-cd:latest
    name: invoke-artcd
    script: $(params.script)
    securityContext:
      privileged: true
      runAsGroup: 0
      runAsUser: 0
    volumeMounts:
    - mountPath: /etc/bugzillarc
      name: bugzilla-apikey
      readOnly: true
      subPath: bugzillarc
    - mountPath: /root/.config/doozer
      name: doozer-config
    - mountPath: /tmp/keytab
      name: kerberos-keytab
    - mountPath: /root/.config/art-bot
      name: art-bot-docker-config
    - mountPath: /tmp/gcp-sa
      name: gcp-sa-key
      readOnly: true
    - mountPath: /tmp/konflux-kubeconfigs
      name: konflux-sa-kubeconfigs
      readOnly: true
    - mountPath: /root/.ssh
      name: openshift-bot-ssh-key
      readOnly: true
    - mountPath: /tmp/quay-authfile
      name: quay-authfile
      readOnly: true
    - mountPath: /tmp/promote-credentials
      name: promote-credentials
      readOnly: true
  volumes:
  - name: bugzilla-apikey
    secret:
      defaultMode: 256
      items:
      - key: bugzillarc
        path: bugzillarc
      secretName: bugzilla-apikey
  - name: doozer-config
    secret:
      secretName: doozer-config
  - name: kerberos-keytab
    secret:
      secretName: synced-exd-ocp-buildvm-bot-prod-keytab
  - name: art-bot-docker-config
    secret:
      secretName: art-bot-docker-config
  - name: gcp-sa-key
    secret:
      secretName: gcp-sa-key
  - name: konflux-sa-kubeconfigs
    secret:
      secretName: konflux-sa-kubeconfigs
  - name: openshift-bot-ssh-key
    secret:
      defaultMode: 256
      secretName: openshift-bot-ssh-key
  - name: quay-authfile
    secret:
      items:
      - key: auth.json
        path: config.json
      secretName: quay-authfile
  # Optional so the other artcd pipelines can run before promotion is configured.
  # promote-assembly validates the credentials needed for its selected options.
  - name: promote-credentials
    projected:
      defaultMode: 256
      sources:
      - secret:
          name: promote-credentials
          optional: true
      - secret:
          name: gcs-publish-credentials
          optional: true
      - secret:
          name: synced-art-publish-ci-dockerconfigjson
          optional: true
          items:
          - key: config.json
            path: quay-config.json
      - secret:
          name: jenkins-credentials
          optional: true
          items:
          - key: jenkins-service-account
            path: jenkins-service-account
          - key: jenkins-token
            path: jenkins-token
