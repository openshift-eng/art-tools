apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: art-pipelines-ui
  namespace: art-pipelines-ui
  labels:
    app: art-pipelines-ui
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: art-pipelines-ui
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 70
    - type: ContainerResource
      containerResource:
        name: memory
        container: app
        target:
          type: AverageValue
          averageValue: 700Mi
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
