apiVersion: apps/v1
kind: Deployment
metadata:
  name: art-pipelines-ui
  namespace: art-pipelines-ui
  labels:
    app: art-pipelines-ui
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"art-pipelines-ui:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: art-pipelines-ui
  template:
    metadata:
      labels:
        app: art-pipelines-ui
    spec:
      serviceAccountName: art-pipelines-ui
      automountServiceAccountToken: false
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/art-pipelines-ui/art-pipelines-ui:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: art-pipelines-ui-config
          env:
            - name: KUBE_CA_FILE
              value: /var/run/secrets/kube-ca/ca.crt
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: app
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).close()"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).close()"
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: service-ca
              mountPath: /var/run/secrets/service-ca
              readOnly: true
            - name: kube-ca
              mountPath: /var/run/secrets/kube-ca
              readOnly: true
            - name: app-tmp
              mountPath: /tmp
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy@sha256:ef45e03a7175ad54e957a67efc819aa4b0412079ed23776b5312f6abc84a30c1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - --provider=openshift
            - --client-id=art-pipelines-ui
            - --client-secret-file=/var/run/oauth-secrets/client-secret
            - --https-address=:8443
            - --http-address=
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/var/run/oauth-secrets/cookie-secret
            - --cookie-name=_art_pipelines_ui_scoped
            - --pass-access-token=true
            - --scope=user:info role:art-pipelines-ui-scope:*
            - --skip-auth-regex=^/api/health$
            - --upstream-timeout=120s
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-secrets
              mountPath: /var/run/oauth-secrets
              readOnly: true
            - name: proxy-kube-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
      volumes:
        - name: oauth-secrets
          secret:
            secretName: art-pipelines-ui-oauth
        - name: service-ca
          configMap:
            name: art-pipelines-ui-service-ca
        - name: kube-ca
          configMap:
            name: kube-root-ca.crt
        - name: app-tmp
          emptyDir: {}
        - name: proxy-tmp
          emptyDir: {}
        - name: proxy-kube-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: proxy-tls
          secret:
            secretName: art-pipelines-ui-proxy-tls
